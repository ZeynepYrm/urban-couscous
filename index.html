    <!-- ... STREAMING_CHUNK:Implementing operational script logic... -->
    <script>
        const defaultRawText = `Begegnen / Karşılaşmak, rastlamak
mitten / Ortasında
schätzungsweise / Tahminen, yaklaşık olarak
Offenbar / Görünüşe göre, anlaşılan

fehlt / Eksik, yok
nämlich / Yani, şöyle ki

Aktivitätsmuster / Aktivite kalıbı, deseni

verankert / Yerleşmiş, kök salmış
drin / İçinde, içeride

vielschichtig / Çok katmanlı, karmaşık

Hauptursache / Ana neden, temel sebep

Dadurch / Bu sayede, bu yüzden

bezeichnen / Adlandırmak, tanımlamak
Verbindungen / Bağlantılar, bağlar`;

        function parseRawTextToCards(text) {
            const lines = text.split('\n');
            const parsedCards = [];
            lines.forEach((line, idx) => {
                const trimmed = line.trim();
                if (trimmed && trimmed.includes('/')) {
                    const parts = trimmed.split('/');
                    const de = parts[0].trim();
                    const tr = parts.slice(1).join('/').trim();
                    if (de && tr) {
                        parsedCards.push({ id: `card_${Date.now()}_${idx}_${de}`, de, tr });
                    }
                }
            });
            return parsedCards;
        }

        const defaultCards = parseRawTextToCards(defaultRawText);

        // State
        let cards = JSON.parse(localStorage.getItem('flashcards')) || defaultCards;
        let knownCardIds = JSON.parse(localStorage.getItem('knownCardIds')) || [];
        let currentIndex = parseInt(localStorage.getItem('currentCardIndex')) || 0;
        let isSoundMuted = true; // Otomatik sessiz
        let showBackSide = false;

        function getUnlearnedCards() {
            return cards.filter(c => !knownCardIds.includes(c.id));
        }

        // Elements
        const cardWrapper = document.getElementById('cardWrapper');
        const flashCard = document.getElementById('flashCard');
        const cardLangLabel = document.getElementById('cardLangLabel');
        const cardWordText = document.getElementById('cardWordText');
        const cardFlipHint = document.getElementById('cardFlipHint');
        const speakCurrentBtn = document.getElementById('speakCurrentBtn');
        const deleteCurrentCardBtn = document.getElementById('deleteCurrentCardBtn');
        const cardProgressText = document.getElementById('cardProgressText');
        const progressBar = document.getElementById('progressBar');
        const knownCountBadge = document.getElementById('knownCountBadge');
        const allLearnedScreen = document.getElementById('allLearnedScreen');
        const restartAllBtn = document.getElementById('restartAllBtn');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const shuffleIcon = document.getElementById('shuffleIcon');
        const resetToStartBtn = document.getElementById('resetToStartBtn');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const addModal = document.getElementById('addModal');
        const bulkInput = document.getElementById('bulkInput');
        const clearInputBtn = document.getElementById('clearInputBtn');
        const saveBulkBtn = document.getElementById('saveBulkBtn');
        const appendBulkBtn = document.getElementById('appendBulkBtn');
        const resetDefaultBtn = document.getElementById('resetDefaultBtn');

        const tabSingleBtn = document.getElementById('tabSingleBtn');
        const tabBulkBtn = document.getElementById('tabBulkBtn');
        const singleAddSection = document.getElementById('singleAddSection');
        const bulkAddSection = document.getElementById('bulkAddSection');
        const singleDeInput = document.getElementById('singleDeInput');
        const singleTrInput = document.getElementById('singleTrInput');
        const addSingleBtn = document.getElementById('addSingleBtn');

        window.addEventListener('DOMContentLoaded', () => {
            updateCardDisplay();
            updateSoundIcon();
        });

        tabSingleBtn.addEventListener('click', () => {
            tabSingleBtn.className = "py-1.5 px-3 text-xs text-indigo-600 border-b-2 border-indigo-600 transition font-normal";
            tabBulkBtn.className = "py-1.5 px-3 text-xs text-slate-400 hover:text-slate-600 transition font-normal";
            singleAddSection.classList.remove('hidden');
            bulkAddSection.classList.add('hidden');
        });

        tabBulkBtn.addEventListener('click', () => {
            tabBulkBtn.className = "py-1.5 px-3 text-xs text-indigo-600 border-b-2 border-indigo-600 transition font-normal";
            tabSingleBtn.className = "py-1.5 px-3 text-xs text-slate-400 hover:text-slate-600 transition font-normal";
            bulkAddSection.classList.remove('hidden');
            singleAddSection.classList.add('hidden');
        });

        addSingleBtn.addEventListener('click', () => {
            const deVal = singleDeInput.value.trim();
            const trVal = singleTrInput.value.trim();
            if (!deVal || !trVal) {
                return;
            }
            const newCard = { id: `card_${Date.now()}_${deVal}`, de: deVal, tr: trVal };
            cards.push(newCard);
            localStorage.setItem('flashcards', JSON.stringify(cards));
            singleDeInput.value = '';
            singleTrInput.value = '';
            updateCardDisplay();
            addModal.classList.add('hidden');
        });

        function renderCardContent() {
            const unlearned = getUnlearnedCards();
            if (unlearned.length === 0) return;
            const currentCard = unlearned[currentIndex];

            if (!showBackSide) {
                cardLangLabel.textContent = "Almanca";
                cardWordText.textContent = currentCard.de;
                cardFlipHint.textContent = "Orta: Çevir";
            } else {
                cardLangLabel.textContent = "Türkçe";
                cardWordText.textContent = currentCard.tr;
                cardFlipHint.textContent = "Orta: Çevir";
            }
        }

        function updateCardDisplay() {
            const unlearned = getUnlearnedCards();
            knownCountBadge.textContent = `${knownCardIds.length} Öğrenildi`;

            if (unlearned.length === 0) {
                cardWrapper.classList.add('hidden');
                allLearnedScreen.classList.remove('hidden');
                cardProgressText.textContent = `Kart 0 / 0`;
                progressBar.style.width = `100%`;
                return;
            } else {
                cardWrapper.classList.remove('hidden');
                allLearnedScreen.classList.add('hidden');
            }

            if (currentIndex >= unlearned.length) {
                currentIndex = Math.max(0, unlearned.length - 1);
            }

            showBackSide = false;
            renderCardContent();

            cardProgressText.textContent = `Kart ${currentIndex + 1} / ${unlearned.length}`;
            const progressPercent = ((currentIndex + 1) / unlearned.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            localStorage.setItem('currentCardIndex', currentIndex);
        }

        function toggleCardFace() {
            const unlearned = getUnlearnedCards();
            if (unlearned.length === 0) return;
            showBackSide = !showBackSide;
            renderCardContent();

            if (!isSoundMuted) {
                const currentCard = unlearned[currentIndex];
                speakText(showBackSide ? currentCard.tr : currentCard.de, showBackSide ? 'tr-TR' : 'de-DE');
            }
        }

        function deleteCurrentCard(e) {
            e.stopPropagation();
            const unlearned = getUnlearnedCards();
            if (unlearned.length === 0) return;

            const currentCard = unlearned[currentIndex];
            
            cards = cards.filter(c => c.id !== currentCard.id);
            localStorage.setItem('flashcards', JSON.stringify(cards));

            if (knownCardIds.includes(currentCard.id)) {
                knownCardIds = knownCardIds.filter(id => id !== currentCard.id);
                localStorage.setItem('knownCardIds', JSON.stringify(knownCardIds));
            }

            if (currentIndex >= getUnlearnedCards().length) {
                currentIndex = Math.max(0, getUnlearnedCards().length - 1);
            }

            updateCardDisplay();
        }

        deleteCurrentCardBtn.addEventListener('click', deleteCurrentCard);

        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            localStorage.setItem('flashcards', JSON.stringify(cards));
            
            shuffleIcon.classList.add('animate-spin');
            setTimeout(() => { shuffleIcon.classList.remove('animate-spin'); }, 500);
            updateCardDisplay();
        }

        shuffleBtn.addEventListener('click', shuffleCards);

        function resetKnownStatus() {
            knownCardIds = [];
            localStorage.removeItem('knownCardIds');
            currentIndex = 0;
            updateCardDisplay();
        }

        restartAllBtn.addEventListener('click', resetKnownStatus);

        resetToStartBtn.addEventListener('click', () => {
            if (knownCardIds.length > 0) {
                resetKnownStatus();
                return;
            }
            currentIndex = 0;
            updateCardDisplay();
        });

        function nextCard() {
            const unlearned = getUnlearnedCards();
            if (unlearned.length === 0) return;
            currentIndex = (currentIndex < unlearned.length - 1) ? currentIndex + 1 : 0;
            updateCardDisplay();
        }

        function prevCard() {
            const unlearned = getUnlearnedCards();
            if (unlearned.length === 0) return;
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : unlearned.length - 1;
            updateCardDisplay();
        }

        function speakText(text, lang) {
            if (isSoundMuted || !('speechSynthesis' in window) || !text) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        speakCurrentBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const unlearned = getUnlearnedCards();
            if (unlearned.length > 0) {
                const currentCard = unlearned[currentIndex];
                speakText(!showBackSide ? currentCard.de : currentCard.tr, !showBackSide ? 'de-DE' : 'tr-TR');
            }
        });

        soundToggleBtn.addEventListener('click', () => {
            isSoundMuted = !isSoundMuted;
            updateSoundIcon();
            if (isSoundMuted && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        function updateSoundIcon() {
            if (isSoundMuted) {
                soundIcon.className = "fas fa-volume-mute text-sm text-rose-500";
                soundToggleBtn.classList.add("border-rose-300", "bg-rose-50");
            } else {
                soundIcon.className = "fas fa-volume-up text-sm text-emerald-600";
                soundToggleBtn.classList.remove("border-rose-300", "bg-rose-50");
            }
        }

        cardWrapper.addEventListener('click', (e) => {
            if (e.target.closest('#speakCurrentBtn') || e.target.closest('#deleteCurrentCardBtn')) return;

            const rect = cardWrapper.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickRatio = clickX / rect.width;

            if (clickRatio < 0.3) {
                prevCard();
            } else if (clickRatio > 0.7) {
                nextCard();
            } else {
                toggleCardFace();
            }
        });

        openModalBtn.addEventListener('click', () => {
            const currentRawText = cards.map(c => `${c.de} / ${c.tr}`).join('\n');
            bulkInput.value = currentRawText;
            addModal.classList.remove('hidden');
        });

        closeModalBtn.addEventListener('click', () => {
            addModal.classList.add('hidden');
        });

        addModal.addEventListener('click', (e) => {
            if (e.target === addModal) addModal.classList.add('hidden');
        });

        clearInputBtn.addEventListener('click', () => {
            bulkInput.value = '';
            bulkInput.focus();
        });

        saveBulkBtn.addEventListener('click', () => {
            const newCards = parseRawTextToCards(bulkInput.value);
            if (newCards.length === 0) return;
            cards = newCards;
            knownCardIds = [];
            localStorage.removeItem('knownCardIds');
            currentIndex = 0;
            localStorage.setItem('flashcards', JSON.stringify(cards));
            updateCardDisplay();
            addModal.classList.add('hidden');
        });

        appendBulkBtn.addEventListener('click', () => {
            const newCards = parseRawTextToCards(bulkInput.value);
            if (newCards.length === 0) return;
            cards = [...cards, ...newCards];
            localStorage.setItem('flashcards', JSON.stringify(cards));
            updateCardDisplay();
            addModal.classList.add('hidden');
        });

        resetDefaultBtn.addEventListener('click', () => {
            cards = [...defaultCards];
            knownCardIds = [];
            localStorage.removeItem('knownCardIds');
            currentIndex = 0;
            localStorage.setItem('flashcards', JSON.stringify(cards));
            updateCardDisplay();
            addModal.classList.add('hidden');
        });

        document.addEventListener('keydown', (e) => {
            if (!addModal.classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                prevCard();
            } else if (e.key === 'Home') {
                currentIndex = 0;
                updateCardDisplay();
            } else if (e.key.toLowerCase() === 's') {
                shuffleCards();
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                toggleCardFace();
            }
        });
    </script>
</body>
</html>
